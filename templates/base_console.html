<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ PRODUCT_NAME }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/brand.css" />
</head>
<body class="k-body">
  <div class="k-top">
    <span class="k-logo">{{ BRAND_EN }} 无界序</span>
    <span class="muted">{% block subtitle %}{% endblock %}</span>
    <span class="sp"></span>
    {% if user %}<span class="muted">{{ user.role }}</span>{% endif %}
    <a href="/logout" class="k-tag" style="text-decoration:none">退出</a>
  </div>
  {% block nav %}{% endblock %}
  <div class="k-main">
    {% block content %}{% endblock %}
    <div class="muted" style="text-align:center;margin-top:26px;font-size:10px;opacity:.6">
      {{ BRAND_EN }} · 服务启动于 {{ BOOT_AT }}（更新代码后请重启，时间不变说明还是旧进程）</div>
  </div>
  {% block script %}{% endblock %}
  <script>
  // 所有宽表格自动包裹滚动容器，保证真机横向可滑、页面不撑破
  document.querySelectorAll("table.k-table").forEach(function (t) {
    if (t.parentElement.classList.contains("k-table-wrap")) return;
    var w = document.createElement("div");
    w.className = "k-table-wrap";
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
  </script>
</body>
</html>
