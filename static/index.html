<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手机号验证码登录</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }
    .card {
      background: #fff; width: 360px; max-width: 92vw; padding: 32px 28px;
      border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.2);
    }
    h1 { font-size: 20px; margin: 0 0 24px; text-align: center; color: #1f2937; }
    label { display: block; font-size: 13px; color: #6b7280; margin: 14px 0 6px; }
    input {
      width: 100%; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 15px; outline: none;
    }
    input:focus { border-color: #6366f1; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    button {
      border: none; border-radius: 8px; cursor: pointer; font-size: 14px; padding: 11px 14px;
    }
    .btn-primary { width: 100%; margin-top: 22px; background: #6366f1; color: #fff; font-size: 15px; }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
    .btn-side { white-space: nowrap; background: #eef2ff; color: #4f46e5; }
    .btn-side:disabled { color: #9ca3af; background: #f3f4f6; cursor: not-allowed; }
    .captcha-q { font-weight: 600; color: #1f2937; padding: 11px 12px; background: #f9fafb;
      border-radius: 8px; min-width: 90px; text-align: center; }
    .msg { margin-top: 16px; font-size: 13px; text-align: center; min-height: 18px; }
    .msg.err { color: #dc2626; }
    .msg.ok { color: #16a34a; }
    .success-box { text-align: center; }
    .success-box .phone { font-size: 22px; font-weight: 700; color: #16a34a; margin: 8px 0 4px; }
    .tip { font-size: 12px; color: #9ca3af; margin-top: 18px; text-align: center; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div id="login-view">
      <h1>手机号验证码登录</h1>

      <label>手机号</label>
      <input id="phone" type="tel" placeholder="请输入 11 位手机号" maxlength="11" />

      <label>人机验证</label>
      <div class="row">
        <div class="captcha-q" id="captcha-q">加载中…</div>
        <input id="captcha-answer" type="text" placeholder="请输入答案" />
        <button class="btn-side" id="refresh-captcha" title="换一题">换一题</button>
      </div>

      <label>验证码</label>
      <div class="row">
        <input id="code" type="text" placeholder="6 位验证码" maxlength="6" />
        <button class="btn-side" id="send-code">获取验证码</button>
      </div>

      <button class="btn-primary" id="login-btn">登 录</button>
      <div class="msg" id="msg"></div>
      <div class="tip">测试模式：点「获取验证码」后，验证码会打印在服务端控制台，<br>DEBUG 模式下也会自动填入。</div>
    </div>

    <div id="success-view" style="display:none">
      <div class="success-box">
        <h1>🎉 登录成功</h1>
        <div class="phone" id="logged-phone"></div>
        <div class="msg ok" id="me-msg"></div>
        <button class="btn-primary" id="logout-btn">退出登录</button>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let captchaId = null;
    let cooldownTimer = null;

    function showMsg(text, ok = false) {
      const el = $("msg");
      el.textContent = text;
      el.className = "msg " + (ok ? "ok" : "err");
    }

    async function loadCaptcha() {
      $("captcha-answer").value = "";
      $("captcha-q").textContent = "加载中…";
      try {
        const r = await fetch("/api/captcha");
        const d = await r.json();
        captchaId = d.captcha_id;
        $("captcha-q").textContent = d.question;
      } catch (e) {
        $("captcha-q").textContent = "加载失败";
      }
    }

    async function sendCode() {
      const phone = $("phone").value.trim();
      if (!/^1[3-9]\d{9}$/.test(phone)) return showMsg("请输入正确的手机号");
      const answer = $("captcha-answer").value.trim();
      if (!answer) return showMsg("请先完成人机验证");

      $("send-code").disabled = true;
      try {
        const r = await fetch("/api/send-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, captcha_id: captchaId, captcha_answer: answer }),
        });
        const d = await r.json();
        if (!r.ok) {
          showMsg(d.detail || "发送失败");
          loadCaptcha();               // 失败后换一道题
          $("send-code").disabled = false;
          return;
        }
        showMsg("验证码已发送，请查看服务端控制台", true);
        if (d.debug_code) $("code").value = d.debug_code;  // DEBUG 模式自动填入
        startCooldown(60);
      } catch (e) {
        showMsg("网络错误");
        $("send-code").disabled = false;
      }
    }

    function startCooldown(sec) {
      const btn = $("send-code");
      let left = sec;
      btn.disabled = true;
      cooldownTimer = setInterval(() => {
        btn.textContent = left + "s";
        if (--left < 0) {
          clearInterval(cooldownTimer);
          btn.disabled = false;
          btn.textContent = "获取验证码";
        }
      }, 1000);
    }

    async function login() {
      const phone = $("phone").value.trim();
      const code = $("code").value.trim();
      if (!/^1[3-9]\d{9}$/.test(phone)) return showMsg("请输入正确的手机号");
      if (!code) return showMsg("请输入验证码");

      $("login-btn").disabled = true;
      try {
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, code }),
        });
        const d = await r.json();
        if (!r.ok) {
          showMsg(d.detail || "登录失败");
          $("login-btn").disabled = false;
          return;
        }
        localStorage.setItem("token", d.token);
        await showSuccess(d.phone);
      } catch (e) {
        showMsg("网络错误");
        $("login-btn").disabled = false;
      }
    }

    async function showSuccess(phone) {
      $("login-view").style.display = "none";
      $("success-view").style.display = "block";
      $("logged-phone").textContent = phone;
      // 用 token 请求受保护接口，验证登录态
      try {
        const r = await fetch("/api/me", {
          headers: { Authorization: "Bearer " + localStorage.getItem("token") },
        });
        const d = await r.json();
        $("me-msg").textContent = r.ok ? d.message : "登录态校验失败";
      } catch (e) {}
    }

    function logout() {
      localStorage.removeItem("token");
      $("success-view").style.display = "none";
      $("login-view").style.display = "block";
      $("login-btn").disabled = false;
      $("phone").value = $("code").value = "";
      showMsg("");
      loadCaptcha();
    }

    $("send-code").onclick = sendCode;
    $("refresh-captcha").onclick = loadCaptcha;
    $("login-btn").onclick = login;
    $("logout-btn").onclick = logout;

    // 已登录则直接进成功页
    (async () => {
      const token = localStorage.getItem("token");
      if (token) {
        const r = await fetch("/api/me", { headers: { Authorization: "Bearer " + token } });
        if (r.ok) { const d = await r.json(); return showSuccess(d.phone); }
        localStorage.removeItem("token");
      }
      loadCaptcha();
    })();
  </script>
</body>
</html>
