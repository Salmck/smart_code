# /etc/nginx/sites-available/wujexu.com
# 启用：ln -s /etc/nginx/sites-available/wujexu.com /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
# SSL 证书行由 certbot 自动管理（certbot --nginx -d wujexu.com -d www.wujexu.com）

# HTTP → HTTPS 跳转（证书装好后 certbot 通常会自动加，这里显式写一份）
server {
    listen 80;
    listen [::]:80;
    server_name wujexu.com www.wujexu.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wujexu.com www.wujexu.com;

    # ---- 上传体积上限：套餐图/二维码参考图最大 8MB，留余量 10M ----
    client_max_body_size 10M;

    # ---- SSL（certbot 会写入实际路径，保持不动即可）----
    ssl_certificate     /etc/letsencrypt/live/wujexu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wujexu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---- 反代到 uvicorn ----
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 配合 uvicorn --proxy-headers，避免死循环跳转
        proxy_read_timeout 60s;
    }

    # ---- （可选）静态与上传文件由 nginx 直接吐，减轻应用负担 ----
    # 路径按你的 WorkingDirectory 调整；不加也能用（应用自身也挂了这两个目录）
    # location /static/ {
    #     alias /opt/ordinex/static/;
    #     expires 7d;
    # }
    # location /uploads/ {
    #     alias /opt/ordinex/data/uploads/;
    #     expires 7d;
    # }
}
